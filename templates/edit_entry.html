<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmTrack - Edit Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="page-fade" style="opacity:0;">
    <div class="top-bar">
        <a href="/view" class="back-btn">←</a>
        <h1>EDIT ENTRY</h1>
    </div>
    <div class="content">
        <div class="form-card">
            <form method="POST">
                <div class="field-group">
                    <label>Field Name</label>
                    <input type="text" name="field_name" value="{{ entry.field_name }}" required>
                </div>
                <div class="field-group">
                    <label>Field Size (acres)</label>
                    <input type="number" name="acres" value="{{ entry.acres }}" required>
                </div>
                <div class="field-group">
                    <label>Input Type</label>
                    <select name="input_type" required onchange="toggleQuantity(this)">
                        <option value="">— Select Input Type —</option>
                        <option {% if entry.input_type == 'Seed' %}selected{% endif %}>Seed</option>
                        <option {% if entry.input_type == '46-0-0 (Urea — Nitrogen)' %}selected{% endif %}>46-0-0 (Urea — Nitrogen)</option>
                        <option {% if entry.input_type == '11-52-0 (MAP — Phosphate)' %}selected{% endif %}>11-52-0 (MAP — Phosphate)</option>
                        <option {% if entry.input_type == '17-0-0 (Sulphur)' %}selected{% endif %}>17-0-0 (Sulphur)</option>
                        <option {% if entry.input_type == 'Herbicide' %}selected{% endif %}>Herbicide</option>
                        <option {% if entry.input_type == 'Fungicide' %}selected{% endif %}>Fungicide</option>
                        <option {% if entry.input_type == 'Crop Insurance Premium' %}selected{% endif %}>Crop Insurance Premium</option>
                        <option {% if entry.input_type == 'Fuel & Oil' %}selected{% endif %}>Fuel & Oil</option>
                        <option {% if entry.input_type == 'Equipment Repairs' %}selected{% endif %}>Equipment Repairs</option>
                        <option {% if entry.input_type == 'Custom Work' %}selected{% endif %}>Custom Work</option>
                        <option {% if entry.input_type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="field-group" id="quantity_wrap" style="display:none;">
                    <label>Quantity (lbs/acre)</label>
                    <input type="number" name="quantity" id="quantity_input" value="{{ entry.quantity or '' }}" placeholder="e.g. 81" step="0.1">
                    <input type="hidden" name="quantity_unit" value="lbs/acre">
                </div>
                <div class="field-group">
                    <label>Cost ($)</label>
                    <input type="number" name="cost" value="{{ entry.cost }}" required>
                </div>
                <div class="field-group">
                    <label>Date</label>
                    <input type="date" name="date" value="{{ entry.date }}" required>
                </div>
                <button type="submit" class="submit-btn">SAVE CHANGES</button>
            </form>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>Home
        </a>
        <a href="/log" class="nav-item">
            <span class="nav-icon">＋</span>Log
        </a>
        <a href="/view" class="nav-item active">
            <span class="nav-icon">📋</span>Fields
        </a>
        <a href="/summary" class="nav-item">
            <span class="nav-icon">📊</span>Summary
        </a>
    </nav>
    <script>
        const FERTILIZERS = ['46-0-0 (Urea — Nitrogen)', '11-52-0 (MAP — Phosphate)', '17-0-0 (Sulphur)'];

        function toggleQuantity(select) {
            const wrap = document.getElementById('quantity_wrap');
            const isFertilizer = FERTILIZERS.includes(select.value);
            wrap.style.display = isFertilizer ? 'block' : 'none';
        }

        // Show quantity on page load if entry already has a fertilizer type
        window.addEventListener('DOMContentLoaded', () => {
            const select = document.querySelector('select[name="input_type"]');
            toggleQuantity(select);
        });
    </script>
    <script src="/static/transitions.js"></script>
</div>
</body>
</html>
