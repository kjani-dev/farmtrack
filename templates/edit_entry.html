<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmTrack - Edit Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="page-fade" style="opacity:0;">
    <div class="top-bar">
        <a href="/view" class="back-btn">←</a>
        <h1>EDIT ENTRY</h1>
    </div>
    <div class="content">
        <div class="form-card">
            <form method="POST">
                <div class="field-group">
                    <label>Field Name</label>
                    <input type="text" name="field_name" value="{{ entry.field_name }}" required>
                </div>
                <div class="field-group">
                    <label>Field Size (acres)</label>
                    <input type="number" name="acres" value="{{ entry.acres }}" required>
                </div>
                <div class="field-group">
                    <label>Crop Type</label>
                    <select name="crop_type" id="crop_type_select">
                        <option value="">— Select Crop —</option>
                        <option {% if entry.crop_type == 'Wheat' %}selected{% endif %}>Wheat</option>
                        <option {% if entry.crop_type == 'Canola' %}selected{% endif %}>Canola</option>
                        <option {% if entry.crop_type == 'Barley' %}selected{% endif %}>Barley</option>
                        <option {% if entry.crop_type == 'Corn' %}selected{% endif %}>Corn</option>
                        <option {% if entry.crop_type == 'Soybeans' %}selected{% endif %}>Soybeans</option>
                        <option {% if entry.crop_type == 'Oats' %}selected{% endif %}>Oats</option>
                        <option {% if entry.crop_type == 'Flax' %}selected{% endif %}>Flax</option>
                        <option {% if entry.crop_type == 'Sunflowers' %}selected{% endif %}>Sunflowers</option>
                        <option {% if entry.crop_type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Input Type</label>
                    <select name="input_type" id="input_type_select" required onchange="toggleQuantity(this); toggleCustomInput(this);">
                        <option value="">— Select Input Type —</option>
                        <option {% if entry.input_type == 'Seed' %}selected{% endif %}>Seed</option>
                        <option {% if entry.input_type == '46-0-0 (Urea — Nitrogen)' %}selected{% endif %}>46-0-0 (Urea — Nitrogen)</option>
                        <option {% if entry.input_type == '82-0-0 (NH3 — Nitrogen)' %}selected{% endif %}>82-0-0 (NH3 — Nitrogen)</option>
                        <option {% if entry.input_type == '28-0-0 (Liquid — Nitrogen)' %}selected{% endif %}>28-0-0 (Liquid — Nitrogen)</option>
                        <option {% if entry.input_type == '11-52-0 (MAP — Phosphate)' %}selected{% endif %}>11-52-0 (MAP — Phosphate)</option>
                        <option {% if entry.input_type == '0-0-60 (Potash)' %}selected{% endif %}>0-0-60 (Potash)</option>
                        <option {% if entry.input_type == '20.5-0-0-24 (Sulphur)' %}selected{% endif %}>20.5-0-0-24 (Sulphur)</option>
                        <option {% if entry.input_type == 'MES S15 (13-33-0-15)' %}selected{% endif %}>MES S15 (13-33-0-15)</option>
                        <option {% if entry.input_type == 'Herbicide' %}selected{% endif %}>Herbicide</option>
                        <option {% if entry.input_type == 'Fungicide' %}selected{% endif %}>Fungicide</option>
                        <option {% if entry.input_type == 'Insecticide' %}selected{% endif %}>Insecticide</option>
                        <option {% if entry.input_type == 'PPE' %}selected{% endif %}>PPE</option>
                        <option {% if entry.input_type == "Labour (Arm's Length)" %}selected{% endif %}>Labour (Arm's Length)</option>
                        <option {% if entry.input_type == 'Crop Insurance Premium' %}selected{% endif %}>Crop Insurance Premium</option>
                        <option {% if entry.input_type == 'Fuel & Oil' %}selected{% endif %}>Fuel & Oil</option>
                        <option {% if entry.input_type == 'Equipment Repairs' %}selected{% endif %}>Equipment Repairs</option>
                        <option {% if entry.input_type == 'Custom Work' %}selected{% endif %}>Custom Work</option>
                        <option value="__custom__">Other — specify</option>
                    </select>
                    <div class="new-field-input" id="custom_input_wrap">
                        <input type="text" name="custom_input_type" placeholder="Enter custom input type" value="{% if entry.is_custom_input %}{{ entry.input_type }}{% endif %}">
                    </div>
                </div>
                <div class="field-group" id="quantity_wrap">
                    <label>Quantity (lbs/acre)</label>
                    <input type="number" name="quantity" id="quantity_input" value="{{ entry.quantity or '' }}" placeholder="e.g. 81" step="0.1">
                    <input type="hidden" name="quantity_unit" value="lbs/acre">
                </div>
                <div class="field-group" id="herbicide_group_wrap">
                    <label>Herbicide Group</label>
                    <select name="herbicide_group" id="herbicide_group_select" onchange="toggleCustomHerbicide(this)">
                        <option value="">— Select Group —</option>
                        <option {% if entry.herbicide_group == 'Group 1' %}selected{% endif %}>Group 1</option>
                        <option {% if entry.herbicide_group == 'Group 2' %}selected{% endif %}>Group 2</option>
                        <option {% if entry.herbicide_group == 'Group 4' %}selected{% endif %}>Group 4</option>
                        <option {% if entry.herbicide_group == 'Group 6' %}selected{% endif %}>Group 6</option>
                        <option {% if entry.herbicide_group == 'Group 9' %}selected{% endif %}>Group 9</option>
                        <option {% if entry.herbicide_group == 'Group 10' %}selected{% endif %}>Group 10</option>
                        <option {% if entry.herbicide_group == 'Group 14' %}selected{% endif %}>Group 14</option>
                        <option {% if entry.herbicide_group == 'Group 15' %}selected{% endif %}>Group 15</option>
                        <option {% if entry.herbicide_group == 'Group 27' %}selected{% endif %}>Group 27</option>
                        <option value="__custom_herb__">Other — specify</option>
                    </select>
                    <div class="new-field-input" id="custom_herb_wrap">
                        <input type="text" name="custom_herbicide_group" placeholder="Enter herbicide group" value="{% if entry.is_custom_herbicide %}{{ entry.herbicide_group }}{% endif %}">
                    </div>
                </div>
                <div class="field-group">
                    <label>Cost ($)</label>
                    <input type="number" name="cost" value="{{ entry.cost }}" required>
                </div>
                <div class="field-group">
                    <label>Date</label>
                    <input type="date" name="date" value="{{ entry.date }}" required>
                </div>
                <button type="submit" class="submit-btn">SAVE CHANGES</button>
            </form>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>Home
        </a>
        <a href="/log" class="nav-item">
            <span class="nav-icon">＋</span>Log
        </a>
        <a href="/view" class="nav-item active">
            <span class="nav-icon">📋</span>Fields
        </a>
        <a href="/summary" class="nav-item">
            <span class="nav-icon">📊</span>Summary
        </a>
    </nav>
    <script>
        const FERTILIZERS = ['46-0-0 (Urea — Nitrogen)', '82-0-0 (NH3 — Nitrogen)', '28-0-0 (Liquid — Nitrogen)', '11-52-0 (MAP — Phosphate)', '0-0-60 (Potash)', '20.5-0-0-24 (Sulphur)', 'MES S15 (13-33-0-15)'];

        function toggleQuantity(select) {
            const wrap = document.getElementById('quantity_wrap');
            const isFertilizer = FERTILIZERS.includes(select.value);
            wrap.classList.toggle('expanded', isFertilizer);

            const herbWrap = document.getElementById('herbicide_group_wrap');
            const isHerbicide = select.value === 'Herbicide';
            herbWrap.classList.toggle('expanded', isHerbicide);
        }

        function toggleCustomInput(select) {
            const wrap = document.getElementById('custom_input_wrap');
            wrap.classList.toggle('visible', select.value === '__custom__');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('input_type_select');
            {% if entry.is_custom_input %}
            select.value = '__custom__';
            {% endif %}
            toggleQuantity(select);
            toggleCustomInput(select);
        });
    </script>
    <script src="/static/transitions.js"></script>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.submit-btn');
    btn.classList.add('saving');
    btn.textContent = 'SAVING...';
    showConfirmCard('edit', 'Changes Saved', null, 900);
    setTimeout(function() { form.submit(); }, 950);
});
</script>
</div>
</body>
</html>
