<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmTrack - Log Cost</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="page-fade" style="opacity:0;">
    <div class="top-bar">
        <a href="/" class="back-btn">←</a>
        <h1>LOG INPUT COST</h1>
    </div>
    <div class="content">
        <div class="form-card">
            <form method="POST">
                <div class="field-group">
                    <label>Field Name</label>
                    <select name="field_name" id="field_select" onchange="toggleNewField(this)" required>
                        <option value="">— Select Field —</option>
                        {% for name, acres in existing_fields %}
                        <option value="{{ name }}" data-acres="{{ acres }}">{{ name }} ({{ acres }} ac)</option>
                        {% endfor %}
                        <option value="__new__">+ Add new field</option>
                    </select>
                    <div class="new-field-input" id="new_field_wrap">
                        <input type="text" name="new_field_name" placeholder="Enter new field name">
                    </div>
                </div>
                <div class="field-group">
                    <label>Field Size (acres)</label>
                    <input type="number" name="acres" id="acres_input" placeholder="e.g. 320" required>
                </div>
                <div class="field-group">
                    <label>Crop Type</label>
                    <select name="crop_type" id="crop_type_select">
                        <option value="">— Select Crop —</option>
                        <option>Wheat</option>
                        <option>Canola</option>
                        <option>Barley</option>
                        <option>Corn</option>
                        <option>Soybeans</option>
                        <option>Oats</option>
                        <option>Flax</option>
                        <option>Sunflowers</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Input Type</label>
                    <select name="input_type" id="input_type_select" required onchange="toggleQuantity(this); toggleCustomInput(this);">
                        <option value="">— Select Input Type —</option>
                        <option>Seed</option>
                        <option>46-0-0 (Urea — Nitrogen)</option>
                        <option>82-0-0 (NH3 — Nitrogen)</option>
                        <option>28-0-0 (Liquid — Nitrogen)</option>
                        <option>11-52-0 (MAP — Phosphate)</option>
                        <option>0-0-60 (Potash)</option>
                        <option>20.5-0-0-24 (Sulphur)</option>
                        <option>MES S15 (13-33-0-15)</option>
                        <option>Herbicide</option>
                        <option>Fungicide</option>
                        <option>Insecticide</option>
                        <option>PPE</option>
                        <option>Labour (Arm's Length)</option>
                        <option>Crop Insurance Premium</option>
                        <option>Fuel &amp; Oil</option>
                        <option>Equipment Repairs</option>
                        <option>Custom Work</option>
                        <option value="__custom__">Other — specify</option>
                    </select>
                    <div class="new-field-input" id="custom_input_wrap">
                        <input type="text" name="custom_input_type" placeholder="Enter custom input type">
                    </div>
                </div>
                <div class="field-group collapsible" id="quantity_wrap">
                    <label>Quantity (lbs/acre)</label>
                    <input type="number" name="quantity" id="quantity_input" placeholder="e.g. 81" step="0.1">
                    <input type="hidden" name="quantity_unit" value="lbs/acre">
                </div>
                <div class="field-group collapsible" id="herbicide_group_wrap">
                    <label>Herbicide Group</label>
                    <select name="herbicide_group" id="herbicide_group_select">
                        <option value="">— Select Group —</option>
                        <option>Group 1</option>
                        <option>Group 2</option>
                        <option>Group 4</option>
                        <option>Group 6</option>
                        <option>Group 9</option>
                        <option>Group 10</option>
                        <option>Group 14</option>
                        <option>Group 15</option>
                        <option>Group 27</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Cost ($)</label>
                    <input type="number" name="cost" placeholder="e.g. 4500" required>
                </div>
                <div class="field-group">
                    <label>Date</label>
                    <input type="date" name="date" required>
                </div>
                <button type="submit" class="submit-btn">SAVE ENTRY</button>
            </form>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>Home
        </a>
        <a href="/log" class="nav-item active">
            <span class="nav-icon">＋</span>Log
        </a>
        <a href="/view" class="nav-item">
            <span class="nav-icon">📋</span>Fields
        </a>
        <a href="/summary" class="nav-item">
            <span class="nav-icon">📊</span>Summary
        </a>
    </nav>
    <script>
        const FERTILIZERS = ['46-0-0 (Urea — Nitrogen)', '82-0-0 (NH3 — Nitrogen)', '28-0-0 (Liquid — Nitrogen)', '11-52-0 (MAP — Phosphate)', '0-0-60 (Potash)', '20.5-0-0-24 (Sulphur)', 'MES S15 (13-33-0-15)'];

        function toggleCustomInput(select) {
            const wrap = document.getElementById('custom_input_wrap');
            wrap.classList.toggle('visible', select.value === '__custom__');
        }

        function toggleQuantity(select) {
            const wrap = document.getElementById('quantity_wrap');
            const isFertilizer = FERTILIZERS.includes(select.value);
            wrap.classList.toggle('expanded', isFertilizer);
            if (!isFertilizer) document.getElementById('quantity_input').value = '';

            const herbWrap = document.getElementById('herbicide_group_wrap');
            const isHerbicide = select.value === 'Herbicide';
            herbWrap.classList.toggle('expanded', isHerbicide);
            if (!isHerbicide) document.getElementById('herbicide_group_select').value = '';
        }

        // Save confirmation toast on submit
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.submit-btn');
            btn.classList.add('saving');
            btn.textContent = 'SAVING...';
            showConfirmCard('save', 'Entry Saved', null, 900);
            setTimeout(function() { form.submit(); }, 950);
        });

        function toggleNewField(select) {
            const wrap = document.getElementById('new_field_wrap');
            const acresInput = document.getElementById('acres_input');
            if (select.value === '__new__') {
                wrap.classList.add('visible');
                acresInput.value = '';
                acresInput.readOnly = false;
            } else {
                wrap.classList.remove('visible');
                const selected = select.options[select.selectedIndex];
                const acres = selected.getAttribute('data-acres');
                if (acres) {
                    acresInput.value = acres;
                    acresInput.readOnly = true;
                }
            }
        }
    </script>
    <script src="/static/transitions.js"></script>
</div>
</body>
</html>
