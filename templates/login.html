<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmTrack - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="page-fade" style="opacity:0;">
    <div class="top-bar">
        <h1>FARMTRACK</h1>
    </div>
    <div class="content" style="max-width:400px;margin:0 auto;">
        <div class="form-card">
            <h2 style="font-family:'Barlow Condensed',sans-serif;color:var(--green);font-size:24px;margin-bottom:20px;">Log In</h2>
            {% if error %}
            <p style="color:#a8321f;font-size:14px;margin-bottom:16px;">{{ error }}</p>
            {% endif %}
            <form method="POST">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">LOG IN</button>
            </form>
            <p style="text-align:center;margin-top:16px;font-size:14px;">
                No account yet? <a href="/signup" style="color:var(--green);font-weight:700;">Sign up</a>
            </p>
        </div>
    </div>
    <script src="/static/transitions.js"></script>
</div>
</body>
</html>
